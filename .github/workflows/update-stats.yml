name: Update org stats

# Refreshes the stats block in profile/README.md from live GitHub data
# across black-candle-technologies, blackcandlelabs, and
# Black-Candle-Administration. See scripts/update_stats.py.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check for STATS_TOKEN
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::error::The STATS_TOKEN secret is not set. Add a GitHub classic PAT with the repo scope so the job can read private repositories in all three organizations."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tokei
        run: |
          curl -fsSL -o /tmp/tokei.tgz https://github.com/XAMPPRocky/tokei/releases/download/v12.1.2/tokei-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/tokei.tgz -C /tmp
          sudo install -m 0755 /tmp/tokei /usr/local/bin/tokei
          tokei --version

      - name: Update stats
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          TOKEI: tokei
        run: python3 scripts/update_stats.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- profile/README.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "Update org stats"
          git push
